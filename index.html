  var answer=null,lastResult=null,stack=[],profileEdit=false;
  var BUD=[{label:'80–120万'},{label:'120–160万'},{label:'>160万'}];var BUDI=[{label:'60万以内'},{label:'60–80万'},{label:'80–120万'},{label:'120–160万'},{label:'160–250万'},{label:'250万以上'}];
  var TYP=[{label:'Townhouse'},{label:'Condo'},{label:'独立屋'},{label:'楼花'}];

  var BATHS=[{label:'1浴'},{label:'2浴'},{label:'3浴+'}];
  var AGE=[{label:'全新'},{label:'楼花'},{label:'二手'},{label:'不限'}];

  var FIELDS=[

    {k:'tNb',label:'目标社区',group:'目标区域与通勤'},

    {k:'school',label:'目标学校',group:'目标区域与通勤'},
    {k:'dest',label:'通勤目的地',group:'目标区域与通勤'},

    {k:'time',label:'可接受通勤',group:'目标区域与通勤',edit:TIM},

    {k:'baths',label:'浴室数',group:'预算与房型',edit:BATHS},
    {k:'sqftMin',label:'最小面积',group:'预算与房型'},
    {k:'age',label:'房龄偏好',group:'预算与房型',edit:AGE},
    {k:'parking',label:'车位',group:'房源细节',edit:PARK},
    {k:'nearTransit',label:'近轨道交通',group:'房源细节'},
    {k:'features',label:'必备配置',group:'房源细节'},
    {k:'pet',label:'宠物友好',group:'房源细节'},
    {k:'family',label:'家庭结构',group:'家庭与学校'},
    {k:'kids',label:'孩子学段',group:'家庭与学校',edit:KIDS},

    {k:'firstTime',label:'首次购房',group:'家庭与学校',edit:YN},

  function esc(s){return (''+s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function pick(v){if(answer===null)return;addUser(v);clearLive();var f=answer;answer=null;f(v,false);}

  function disablePickables(){var n=list.querySelectorAll('.qr.pickable button'),i;for(i=0;i<n.length;i++){n[i].disabled=true;n[i].style.opacity='0.45';n[i].style.pointerEvents='none';}}
  function ask(html,opts,resolver){flushReason();disablePickables();typing(function(){addAI(html);if(opts)quick(opts);answer=resolver;});}
  function askInput(html,examples,resolver){flushReason();disablePickables();typing(function(){addAI(html);if(examples)quick(examples);answer=resolver;inp.focus();});}
  function addBlock(html,tapFn){var r=document.createElement('div');r.className='row';r.innerHTML='<div class="av"><i class="ti ti-sparkles"></i></div>';var d=document.createElement('div');d.style.flex='1';d.style.minWidth='0';d.innerHTML=html;r.appendChild(d);list.appendChild(r);if(tapFn){var n=d.querySelectorAll('[data-tap]');for(var i=0;i<n.length;i++){(function(el){el.addEventListener('click',function(){tapFn(el.getAttribute('data-tap'),el.getAttribute('data-city')||'');});})(n[i]);}}scroll();}
  function pref(){var cnt=0;for(var i=0;i<FIELDS.length;i++){if(profile[FIELDS[i].k])cnt++;}pc.textContent=cnt?('已记录 '+cnt+' 项偏好'):'AI 会边聊边记录你的偏好';}
  function askBudget(next){var inv=/投资/.test(profile.purpose||'')||/投资/.test(profile.anchor||'');ask('预算大概多少？',inv?BUDI:BUD,function(v){profile.budget=v;pref();next();});}
  function askType(next){ask('想要什么房型？',TYP,function(v){profile.htype=v;pref();next();});}
  function askListingReqs(next){var askBd=function(){if(profile.beds)next();else ask('想要几房（卧室数）？',BEDS,function(v){profile.beds=v;pref();next();});};var askB=function(){if(profile.budget)askBd();else askBudget(askBd);};if(profile.htype)askB();else askType(askB);}

  function subCity(sub){var t=(''+(sub||'')).split('·')[0].trim();var M={'TO Downtown':'Toronto Downtown','TO Midtown':'Toronto Midtown','TO East':'Toronto East','TO West':'Toronto West'};return M[t]||t;}
  function cardBg(img){return img?('<div style="position:absolute;inset:0;background:url('+img+') center/cover no-repeat;opacity:.15;pointer-events:none"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.78) 78%);pointer-events:none"></div>'):'';}
  function ncard(name,sub,sc,line,m1,m1l,m2,m2l){var ct=subCity(sub);if(m1l==='到Downtown'){var nd=nbData(name,ct);if(m2l==='中位价'){m1=nd.active+' 套';m1l='范围内房源';}else{m1='$'+nd.med+'万';m1l='社区售出中位价';}}return '<div class="cc" data-tap="'+name+'" data-kind="nb" data-city="'+ct+'" style="width:192px;flex:none;position:relative;overflow:hidden">'+cardBg((CX[ct]||{}).img)+'<div style="position:relative"><div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:7px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+sub+'</div></div></div><div style="font-size:11.5px;color:var(--color-text-secondary);line-height:1.45;margin-bottom:8px">'+line+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><div class="met"><div class="v">'+m1+'</div><div class="l">'+m1l+'</div></div><div class="met"><div class="v">'+m2+'</div><div class="l">'+m2l+'</div></div></div><div style="font-size:12px;color:#0F6E56;font-weight:500">查看详情 <i class="ti ti-chevron-right"></i></div></div></div>';}
  function citycard(name,sub,m1,m1l,m2,m2l){return '<div class="cc" data-tap="'+name+'" style="width:192px;flex:none;position:relative;overflow:hidden">'+cardBg((CX[name]||{}).img)+'<div style="position:relative"><div style="display:flex;align-items:center;gap:7px;margin-bottom:8px"><i class="ti ti-building-skyscraper" style="font-size:18px;color:#0F6E56"></i><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+sub+'</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><div class="met"><div class="v">'+m1+'</div><div class="l">'+m1l+'</div></div><div class="met"><div class="v" style="color:#0F6E56">'+m2+'</div><div class="l">'+m2l+'</div></div></div><div style="font-size:12px;color:#0F6E56;font-weight:500">看该市详情 <i class="ti ti-chevron-right"></i></div></div></div>';}
  function districtcard(name,landmark,line,m1,m1l,m2,m2l,city){return '<div class="cc" data-tap="'+name+'" data-kind="district"'+(city?(' data-city="'+city+'"'):'')+' style="width:176px;flex:none"><div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><i class="ti ti-building-store" style="font-size:18px;color:#0F6E56"></i><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+landmark+'</div></div></div><div style="font-size:11.5px;color:var(--color-text-secondary);line-height:1.45;margin-bottom:8px">'+line+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px"><div class="met"><div class="v">'+m1+'</div><div class="l">'+m1l+'</div></div><div class="met"><div class="v">'+m2+'</div><div class="l">'+m2l+'</div></div></div><div style="font-size:12px;color:#0F6E56;font-weight:500">查看详情 <i class="ti ti-chevron-right"></i></div></div>';}
  function schoolcard(name,sub,sc,course){return '<div class="cc" data-tap="'+name+'" data-kind="school" style="width:192px;flex:none"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><i class="ti ti-school" style="font-size:18px;color:#0F6E56"></i><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">'+name+'</div><div class="muted" style="font-size:11px">'+sub+'</div></div></div><div class="met"><div class="v">'+sc+'</div><div class="l">Fraser 评分</div></div>'+(course?'<div style="font-size:11.5px;color:var(--color-text-secondary);line-height:1.45;margin-top:7px">'+course+' · 可下钻 catchment 内房源</div>':'')+'<div style="font-size:12px;color:#0F6E56;font-weight:500;margin-top:8px">查看详情 <i class="ti ti-chevron-right"></i></div></div>';}
  function lcard(price,spec,tg){return '<div class="cc" data-tap="'+price+'" style="display:flex;gap:9px;align-items:center;padding:9px;margin-bottom:8px"><div class="thumb"><i class="ti ti-photo" style="font-size:19px"></i></div><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:500">'+price+'</div><div class="muted" style="font-size:11px">'+spec+'</div>'+(tg?'<span class="tag" style="background:var(--color-background-info);color:var(--color-text-info);margin-top:3px">'+tg+'</span>':'')+'</div><i class="ti ti-chevron-right muted"></i></div>';}
  function hlcard(price,spec){return '<div class="cc" data-tap="'+price+'" style="width:142px;flex:none;padding:0;overflow:hidden"><div style="height:82px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;color:var(--color-text-tertiary)"><i class="ti ti-photo" style="font-size:22px"></i></div><div style="padding:8px 9px"><div style="font-size:13px;font-weight:500">'+price+'</div><div class="muted" style="font-size:10.5px;margin-top:2px">'+spec+'</div></div></div>';}

  function section(t,inner){return '<div><div class="sec">'+t+'</div>'+inner+'</div>';}
  function metGrid(a){var c='';for(var i=0;i<a.length;i++)c+='<div class="met" style="padding:8px 9px"><div class="v" style="font-size:15px">'+a[i][0]+'</div><div class="l">'+a[i][1]+'</div></div>';return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">'+c+'</div>';}
  function fitcard(t){return '<div class="cc" style="background:#E1F5EE;border-color:#9FE1CB"><div style="display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:#0F6E56;margin-bottom:5px"><i class="ti ti-sparkles"></i>为你而选</div><div style="font-size:12px;line-height:1.5;color:#085041">'+t+'</div></div>';}
  function riskcard(t){return '<div><div class="sec" style="margin-bottom:7px">风险与权衡</div><div class="cc"><div style="font-size:12px;line-height:1.5;color:var(--color-text-secondary)">'+t+'</div></div></div>';}
  function bottomBar(){return '<div class="inbar" style="gap:9px"><button class="btn" style="flex:none;width:46px;padding:10px;background:var(--color-background-secondary);color:var(--color-text-primary)"><i class="ti ti-heart"></i></button><button class="btn" style="flex:1;width:auto" data-cta="agent">联系经纪</button></div>';}
  var LSTSHORT=[['$142万','3床2浴·TH'],['$148万','3床3浴·近地铁'],['$135万','3床2浴·学区'],['$129万','2+den·公寓'],['$156万','3床·新盘'],['$138万','3床2浴·角位'],['$162万','4床·半独立'],['$125万','2床·好出租'],['$151万','3床·带车库'],['$144万','3床·南向']];
  function listingsScroll(label,count,noMore){var cards='';for(var i=0;i<LSTSHORT.length;i++)cards+=hlcard(LSTSHORT[i][0],LSTSHORT[i][1]);if(!noMore)cards+='<div class="cc" data-more="1" style="width:104px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center"><i class="ti ti-arrow-right" style="font-size:22px;color:#0F6E56"></i><span style="font-size:11.5px;line-height:1.35;color:#0F6E56">看更多<br>全部 '+count+' 套</span></div>';return '<div><div style="display:flex;align-items:baseline;margin-bottom:8px"><span class="sec" style="margin:0">'+label+'</span><span class="muted" style="font-size:11px;margin-left:auto">共 '+count+' 套</span></div><div style="display:flex;gap:9px;overflow-x:auto;padding-bottom:4px">'+cards+'</div></div>';}
  function listingsListHtml(){var rows='',d=[['$142万','3 床 2 浴 · Townhouse · 1,450 sqft','新上架'],['$148万','3 床 3 浴 · Townhouse · 近地铁站',''],['$135万','3 床 2 浴 · 学区内 · 1,380 sqft',''],['$129万','2+den · 公寓 · 高层江景',''],['$156万','3 床 · 新盘 · 2024 入伙','新上架'],['$138万','3 床 2 浴 · 角位 · 带后院',''],['$162万','4 床 · 半独立 · 双车位',''],['$144万','3 床 2 浴 · 南向 · 近公园','']];for(var i=0;i<d.length;i++)rows+=lcard(d[i][0],d[i][1],d[i][2]);return dhd('房源列表')+'<div style="display:flex;gap:7px;padding:8px 12px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);flex:none;overflow-x:auto"><span class="tag" style="background:#0F6E56;color:#fff;padding:5px 11px;white-space:nowrap">符合我的条件</span><span class="tag" style="background:var(--color-background-secondary);color:var(--color-text-secondary);padding:5px 11px;white-space:nowrap">价格</span><span class="tag" style="background:var(--color-background-secondary);color:var(--color-text-secondary);padding:5px 11px;white-space:nowrap">房型</span><span class="tag" style="background:var(--color-background-secondary);color:var(--color-text-secondary);padding:5px 11px;white-space:nowrap">排序</span></div><div class="dscroll">'+rows+'</div>';}
  function openListingsList(){openPage(listingsListHtml());}

  function listingsBlock(invest){var mid=Math.round(parseBudgetMid(profile.budget)||142);var ht=profile.htype||'Townhouse',bd=((profile.beds||'').match(/\d/)||['3'])[0],sq=ht==='Condo'?'900':(ht==='独立屋'?'2,400':'1,450');addBlock(lcard('$'+Math.round(mid*0.94)+'万',bd+' 床 2 浴 · '+ht+' · '+sq+' sqft','新上架')+lcard('$'+mid+'万',bd+' 床 '+(ht==='Condo'?'2':'3')+' 浴 · '+ht+' · 近地铁站','')+lcard('$'+Math.round(mid*1.05)+'万',bd+' 床 2 浴 · '+ht+' · 学区内',''),function(p){openListing(p,invest);});}
  function reasonCond(){var p=profile,c=[];if(p.budget)c.push('预算 '+p.budget);if(p.htype)c.push(p.htype);if(p.beds)c.push(p.beds);if(p.family)c.push(p.family);if(p.tone)c.push(p.tone);else if(p.vibe)c.push('偏好'+p.vibe);if(p.view)c.push(p.view);if(p.mode&&!p.dest)c.push(p.mode);return c;}
  function reasonLead(){var p=profile;if(p.invGoal)return '你以投资为主（'+p.invGoal+'），按租售比 / 现金流 / 增值 / 流动性来挑，而非自住体验';if(p.dest)return '你要通勤到 '+p.dest+(p.mode?('（'+p.mode+'）'):'')+'，优先进城快 / 在可接受通勤圈内的';if(p.school)return '你锁定目标学校，按其 catchment 反推可买范围';if(p.district)return '你锁定 '+p.district+'，在它的步行范围内按你的条件筛';var tgt=[p.tNb,p.tZone,p.tCity].filter(Boolean).join('、');if(tgt)return '你已定 '+tgt+'，在该范围内按你的条件排序';if(p.anchor&&p.anchor.indexOf("学区")>=0)return '你要找高分学校，按 Fraser 评分 / 课程 / catchment 来挑';if(p.anchor&&p.anchor.indexOf("商圈")>=0)return '你按商圈氛围找，先定到具体商圈，再出范围内房源';return '你还没定方向，我用你的家庭阶段、生活感觉和最看重来反推城市';}
  var pendingReason=null,REASON_ON=false;/* 「为什么给你推荐这些」理由框 2026-07-10 暂缓下线；置 true 即恢复 */

  /* ---------- 选定块 / 比较里的「选 X」：切本次范围 + 加入关注区域，不再清空别的分支 ---------- */
